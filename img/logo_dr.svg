<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&amp;family=Montserrat:wght@300;400&amp;display=swap');
      .monogram {
        font-family: 'Cormorant Garamond', 'Times New Roman', Georgia, serif;
        font-size: 138px;
        font-weight: 500;
        fill: #5b21b6;
      }
      .doctor-title {
        font-family: 'Cormorant Garamond', 'Times New Roman', Georgia, serif;
        font-size: 38px;
        font-weight: 500;
        letter-spacing: 3px;
        fill: #1e1b4b;
      }
      .specialty {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-size: 14px;
        font-weight: 400;
        letter-spacing: 5px;
        fill: #6d28d9;
      }
      .line-sep {
        stroke: #8b5cf6;
        stroke-width: 1.3;
      }
    </style>
  </defs>

  <!-- Monograma Entrelazado DR -->
  <g transform="translate(0, 5)">
    <text x="208" y="118" text-anchor="middle" class="monogram">D</text>
    <text x="278" y="118" text-anchor="middle" class="monogram">R</text>
  </g>

  <!-- Nombre de la Doctora -->
  <text x="250" y="185" text-anchor="middle" class="doctor-title">DRA. DORIS ROMERO</text>

  <!-- Líneas laterales y Subtítulo -->
  <line x1="55" y1="215" x2="145" y2="215" class="line-sep" />
  <text x="250" y="220" text-anchor="middle" class="specialty">MEDICINA ESTÉTICA</text>
  <line x1="355" y1="215" x2="445" y2="215" class="line-sep" />
</svg>
